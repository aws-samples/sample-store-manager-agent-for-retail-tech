[pytest]
env =
    REGION=ap-northeast-1
    TABLE_BUCKET_ARN=arn:aws:s3tables:ap-northeast-1:123456789012:bucket/test-bucket
    NAMESPACE=test_store_data
    ATHENA_OUTPUT_LOCATION=s3://test-athena-output/
    ATHENA_WORKGROUP=test-workgroup
    AGENTCORE_RUNTIME_ARN=arn:aws:bedrock-agentcore:ap-northeast-1:123456789012:runtime/test-runtime
    AGENTCORE_REGION=ap-northeast-1
    HEARING_AGENTCORE_MEMORY_ID=test_hearing_memory-12345ABCDE
    DAILY_SUMMARY_AGENTCORE_MEMORY_ID=test_summary_memory-12345ABCDE

filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore:The HMAC key is.*:UserWarning
